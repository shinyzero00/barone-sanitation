x-database-environment: &database-environment
  DATABASE_URL: host=postgres port=5432 sslmode=disable
  PGUSER: ${POSTGRES_USER:-sanitation}
  PGDATABASE: ${POSTGRES_DB:-sanitation}
  PGPASSWORD: ${POSTGRES_PASSWORD:-}

x-backend: &backend
  image: barone-sanitation-backend:local
  build:
    context: .
    dockerfile: Dockerfile
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanitation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-sanitation}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    shm_size: 64mb
    networks: [database]

  migrate:
    <<: *backend
    command: [migrate, up]
    restart: "no"
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]

  backend:
    <<: *backend
    restart: unless-stopped
    environment:
      <<: *database-environment
      LISTEN_ADDRESS: 0.0.0.0:8080
      PUBLIC_ORIGIN: https://${CADDY_DOMAIN:-localhost}
      TRUSTED_PROXIES: ${CADDY_IP:-172.30.240.2}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-}
      OTP_PROVIDER: ${OTP_PROVIDER:-smtp}
      OTP_TTL: ${OTP_TTL:-10m}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_INTERVAL: ${OTP_RESEND_INTERVAL:-1m}
      OTP_LOCKOUT: ${OTP_LOCKOUT:-15m}
      SESSION_TTL: ${SESSION_TTL:-720h}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-10s}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10s}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RATE_WINDOW: ${RATE_WINDOW:-1m}
      RATE_LIMIT: ${RATE_LIMIT:-30}
      SLOT_STEP: ${SLOT_STEP:-15m}
      PRICE_CURRENCY: ${PRICE_CURRENCY:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    networks: [proxy, database]

  caddy:
    image: barone-sanitation-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      proxy:
        ipv4_address: ${CADDY_IP:-172.30.240.2}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  database:
    internal: true
  proxy:
    ipam:
      config:
        - subnet: ${CADDY_SUBNET:-172.30.240.0/24}
