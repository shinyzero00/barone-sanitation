services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: sanitation
      POSTGRES_PASSWORD: sanitation
      POSTGRES_DB: sanitation
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanitation -d sanitation"]
      interval: 2s
      timeout: 3s
      retries: 30
    shm_size: 64mb

volumes:
  postgres_data:
